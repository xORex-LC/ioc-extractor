# ============================================================================
#  ioc-extractor — operator override (production daemon)
#
#  Loaded via:  --spring.config.additional-location=optional:file:./etc/application.yml
#  WorkingDirectory is the install prefix, so all relative paths below resolve
#  under it (e.g. ./var/inbox -> <prefix>/var/inbox).
#
#  This file only OVERRIDES the packaged defaults (in the jar). Everything not
#  set here keeps its built-in value. Edit a separate candidate and apply it with
#  `sudo <prefix>/bin/ioc-config apply <candidate.yml>`; do not edit this live file.
# ============================================================================
spring:
  profiles:
    active: daemon          # activates the daemon logback profile / ECS file appender

logging:
  level:
    root: INFO
    com.iocextractor: INFO
    com.hierynomus.smbj.connection.Connection: WARN
  file:
    path: var/logs          # rolling ECS-JSON log under <prefix>/var/logs

# Actuator-only HTTP surface. Keep loopback-only unless authentication and a
# reviewed exposure policy are added.
server:
  address: 127.0.0.1
  port: 8081                 # deploy-local/install --server-port may override via CLI
  tomcat:
    threads:
      max: 8
      min-spare: 1
    accept-count: 10
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      status:
        order: down,out-of-service,degraded,unknown,up
        http-mapping:
          degraded: 200
      show-details: always

ioc:
  runtime:
    mode: daemon            # also forced on the command line by the systemd unit
  observability:
    mode: daemon            # ECS logging tuned for a long-running process
    per-item-trace-enabled: false
  pipeline:
    # Preserve a structurally completed ingestion saga while surfacing a
    # degraded extraction outcome for recoverable per-element errors.
    deduplicate: true
    failure-policy: collect-and-continue
    max-diagnostics-per-run: 10000
  # Keep durable SQLite state separate from CSV references/projections. SQLite
  # creates WAL/SHM sidecars next to each DB, so var/db is the backup unit.
  storage:
    service:
      type: jdbc
      url: "jdbc:sqlite:./var/db/ioc-service.db"
      sqlite:
        tuning: low-memory
      pool:
        write-max: 1
        read-max: 2
    dataframe:
      type: jdbc
      url: "jdbc:sqlite:./var/db/ioc-dataframe.db"
      sqlite:
        tuning: low-memory
      pool:
        write-max: 1
        read-max: 2

  # ---- Source reading and extraction ---------------------------------------
  source:
    type: auto
    charset: auto             # use windows-1251 only for misdetected legacy HTML/text
    section-markers:
      - "БИБ-\\d+"
      - "Письмо ФСТЭК России[^№]*№\\s*[\\d/]+"

  # Ordered literal replacements: keep specific protocol tokens before hxxp.
  refang:
    rules:
      - { from: "hxxps", to: "https" }
      - { from: "hxxp",  to: "http" }
      - { from: "[.]",   to: "." }
      - { from: "[:]",   to: ":" }
      - { from: "(dot)", to: "." }
      - { from: "[at]",  to: "@" }

  engine: re2j
  patterns:
    SHA256: "\\b[0-9a-fA-F]{64}\\b"
    SHA1:   "\\b[0-9a-fA-F]{40}\\b"
    MD5:    "\\b[0-9a-fA-F]{32}\\b"
    URL:    "https?://[^\\s;,<>\"']+"
    IPV4:   "\\b(?:\\d{1,3}\\.){3}\\d{1,3}(?:[:/][^\\s;,<>\"']*)?"
    DOMAIN: "\\b(?:[a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}(?:/[^\\s;,<>\"']*)?"

  # First-match-wins network-mask classification.
  classify:
    rules:
      - { when: [ has-query ],        url-match: "u:hAS,pEX", host-match: null }
      - { when: [ has-path-or-port ], url-match: "u:hEX,dEX", host-match: null }
      - { when: [ is-subdomain ],     url-match: "u:hEX",     host-match: "h:dEX" }
      - { when: [],                   url-match: "u:hAS",     host-match: "h:dAS" }

  # ---- Mutable CSV projections ---------------------------------------------
  # These schemas are a durable external contract. Prefer changing only paths,
  # charset or enablement unless a coordinated schema migration is intended.
  # A constant column may set `value`; optional column selectors are `type`,
  # `when-type` and ordered `transform` entries, all demonstrated below.
  # value: "custom-value"    # example constant payload
  sink:
    csv:
      delimiter: ";"
      quote: "\""
      null-literal: "NULL"
      charset: UTF-8
    artifacts:
      - name: masks
        enabled: true
        path: "./dataframe/masks_list_generated.csv"
        accepts: [ IPV4, DOMAIN, URL ]
        exclude: [ is-bare-ip ]
        id: { strategy: ascending, start: auto }
        columns:
          - { name: id,              from: id }
          - { name: mask,            from: value, transform: [ lower-host ] }
          - { name: url_match,       from: match.url }
          - { name: host_match,      from: match.host }
          - { name: score,           from: const, type: INTEGER }
          - { name: time_last_seen,  from: const }
          - { name: time_first_seen, from: const }
          - { name: threat_type,     from: const }
          - { name: source,          from: source.label }
          - { name: description,     from: const }
      - name: ip_list
        enabled: true
        path: "./dataframe/ip_list_generated.csv"
        accepts: [ IPV4 ]
        include: [ is-bare-ip ]
        id: { strategy: ascending, start: auto }
        columns:
          - { name: id,              from: id }
          - { name: ip,              from: value }
          - { name: score,           from: const, type: INTEGER }
          - { name: time_last_seen,  from: const }
          - { name: time_first_seen, from: const }
          - { name: threat_type,     from: const }
          - { name: source,          from: source.label, transform: [ "strip-prefix:Письмо " ] }
          - { name: description,     from: const }
      - name: address_blacklist
        enabled: true
        path: "./dataframe/address_blacklist_generated.csv"
        accepts: [ IPV4, DOMAIN, URL ]
        columns:
          - { name: forbidden_url, from: address.url, transform: [ lower-host ] }
          - { name: forbidden_ip,  from: address.ip,  transform: [ lower-host ] }
      - name: hashes
        enabled: true
        path: "./dataframe/hashes_list_generated.csv"
        accepts: [ MD5, SHA1, SHA256 ]
        id: { strategy: ascending, start: auto }
        columns:
          - { name: id,              from: id }
          - { name: hash_md5,        from: value, when-type: MD5,    transform: [ upper ] }
          - { name: hash_sha256,     from: value, when-type: SHA256, transform: [ upper ] }
          - { name: hash_sha1,       from: value, when-type: SHA1,   transform: [ upper ] }
          - { name: score,           from: const, type: INTEGER }
          - { name: time_last_seen,  from: const }
          - { name: time_first_seen, from: const }
          - { name: threat_type,     from: const }
          - { name: source,          from: source.label, transform: [ "strip-prefix:Письмо " ] }
          - { name: description,     from: const }

  artifact-identity:
    artifacts:
      # epoch: 2              # optional controlled identity migration
      - name: masks
        key-columns: [ mask ]
        key-mode: composite
        record-key: mask-row-v1
        match-keys: [ { name: mask-v1, key-columns: [ mask ] } ]
      - name: ip_list
        key-columns: [ ip ]
        key-mode: composite
        record-key: ip-row-v1
        match-keys: [ { name: ip-v1, key-columns: [ ip ] } ]
      - name: address_blacklist
        key-columns: [ forbidden_url, forbidden_ip ]
        key-mode: composite
        record-key: address-row-v2
        epoch: 2
        match-keys:
          - { name: forbidden-url-v1, key-columns: [ forbidden_url ] }
          - { name: forbidden-ip-v1, key-columns: [ forbidden_ip ] }
      - name: hashes
        key-columns: [ hash_md5, hash_sha1, hash_sha256 ]
        key-mode: composite
        record-key: hash-row-v2
        epoch: 2
        match-keys:
          - { name: hash-md5-v1, key-columns: [ hash_md5 ] }
          - { name: hash-sha1-v1, key-columns: [ hash_sha1 ] }
          - { name: hash-sha256-v1, key-columns: [ hash_sha256 ] }

  # ---- Managed dataframe import --------------------------------------------
  # Disabled baseline. Enabling requires explicit source, authority and
  # versioned contract definitions; intake opens only after startup recovery.
  dataframe-import:
    enabled: false
    sources: []
    authority-profiles: []
    contracts: []
    runtime:
      dirs:
        processing: "./var/import/processing"
        snapshots: "./var/import/snapshots"
        staging: "./var/import/staging"
        terminal: "./var/import/terminal"
        quarantine: "./var/import/quarantine"
      detect:
        use-watch-service: false
        use-change-notifications: true
        reconcile-interval: 2s
      stability:
        quiet-period: 2s
      retry:
        delay: 2s
      limits:
        maximum-snapshot-bytes: 268435456
        recovery-batch-size: 100
      retention:
        successful: { max-age: 30d, max-count: 0, action: delete }
        unsuccessful: { max-age: 90d, max-count: 0, action: delete }
        interval: 1h
        batch-size: 100
      shutdown-timeout: 30s
    # Complete schema illustration. Keep these entries commented until an
    # operator has defined and qualified the intended trust boundary.
    # sources:
    #   - id: trusted-local
    #     transport: local
    #     location: ./var/import/inbox
    #     endpoint:
    #     contracts: [ ip-list-v1 ]
    #     authority: standard-feed
    # authority-profiles:
    #   - id: standard-feed
    #     artifacts: [ ip_list ]
    #     maximum-merge-policy: fill-missing
    #     allow-related-routing: false
    #     allow-machine-only-formula-preserve: false
    # contracts:
    #   - id: ip-list-v1
    #     version: 1
    #     charset: UTF-8
    #     dialect:
    #       delimiter: ";"
    #       quote: '"'
    #       record-separator: crlf-or-lf
    #       header-required: true
    #       null-literals: [ "NULL" ]
    #     recognition:
    #       required-columns: [ ip ]
    #       optional-columns: [ score ]
    #       ignored-columns: []
    #       aliases: {}
    #     mode: as-is
    #     routing: target-only
    #     row-failure-policy: accept-valid
    #     duplicate-policy: coalesce
    #     renew-unchanged: true
    #     formula-policy: reject
    #     merge-default: fill-missing
    #     artifacts:
    #       - name: ip_list
    #         role: primary
    #         record-key: ip-row-v1
    #         match-keys: [ ip-v1 ]
    #         merge-default:
    #         columns:
    #           - target: ip
    #             source: ip
    #             transforms: []
    #             merge-policy:
    #     requested-slot:
    #       source-column: id
    #       profile: reputation-lists
    #       existing-record-policy: preserve-existing

  # ---- Immutable export -----------------------------------------------------
  export:
    enabled: true
    root: "./var/export"
    trigger:
      # Canonical-change events are the fast path. One second coalesces a burst
      # into one slice; the ten-second interval is only a lost-event backstop.
      type: quiet-period
      interval: 10s
      quiet-period: 1s
      max-cap: 30s
    profiles:
      - name: reputation-lists
        output-mode: complete
        artifacts: [ masks, ip_list, hashes ]
      - name: address-blacklist
        output-mode: complete
        artifacts: [ address_blacklist ]
    retention:
      max-age: 7d
      max-count: 3

  # ---- Whole-file daemon ingestion -----------------------------------------
  ingestion:
    dirs:
      inbox: "./var/inbox"
      processing: "./var/processing"
      done: "./var/done"
      failed: "./var/failed"
    patterns:
      include: [ "*.htm", "*.html", "*.docx" ]  # add "*.pdf" when required
      exclude: [ "*.tmp", "*.part", ".*" ]
    detect:
      # Polling is the correctness baseline. WatchService remains an opt-in
      # latency optimization for local filesystems with reliable events.
      use-watch-service: false
      reconcile-interval: 5s
      max-messages-per-poll: 50
    stability:
      quiet-period: 2s
    retry:
      max-attempts: 3
      backoff: 5s
    ledger:
      type: file
      path: "./var/ledger"
    concurrency: 1             # required in 0.3.0; parallel ingestion is not supported

  # Fresh-install preset. Upgrade preserves the existing operator-owned YAML
  # and requires the documented two-step cutover before fixed validity starts.
  lifecycle:
    validity:
      mode: fixed
      fixed-ttl: 12h
      existing-records: reject
    history-retention: 30d
    history-cleanup-interval: 1h
    receipt-retention: 30d
    reconcile:
      backstop-interval: 5s
      batch-size: 1000
    clock:
      max-backward-skew: 2s
      max-clamp-duration: 30s

  # ---- Leaf-file retention --------------------------------------------------
  maintenance:
    retention:
      enabled: false
      interval: 1h
      initial-delay: 5m
      targets:
        - { name: done, dir: "./var/done", max-age: 30d, max-count: 0, action: delete }
        - { name: failed, dir: "./var/failed", max-age: 90d, max-count: 0, action: delete }
        # Archive form (replace a target above):
        # - { name: failed, dir: "./var/failed", max-age: 90d, max-count: 0,
        #     action: archive, archive-dir: "./var/archive/failed" }

  # ---- Remote synchronization over SMB (disabled until uncommented) --------
  sync:
    enabled: false
    retry:
      max-attempts: 3
      backoff: 1s
      multiplier: 2.0
      max-backoff: 30s
      jitter: true
    endpoints: []
    fetch:
      enabled: false
      interval: 10s
      sources: []
    publish:
      enabled: false
      interval: 10s
      targets: []

  # To enable SMB, replace the complete sync block above with this example.
  # Credentials come from etc/ioc-extractor.env. Never put a plaintext password
  # into this YAML. Fetch is read-only on the remote source; publish writes an
  # immutable export slice and its _SUCCESS marker atomically.
  # sync:
  #   enabled: true
  #   endpoints:
  #     - name: delivery-share
  #       transport: smb
  #       smb:
  #         host: files.example.org
  #         port: 445
  #         share: ioc
  #         domain: CORP               # optional
  #         username: ${SMB_USER}
  #         password: ${SMB_PASSWORD}
  #         encryption: required
  #         connect-timeout: 10s
  #         request-timeout: 30s
  #         idle-timeout: 5m
  #   fetch:
  #     enabled: true
  #     interval: 10s
  #     sources:
  #       - name: incoming-ioc
  #         endpoint: delivery-share
  #         remote-path: /incoming
  #         include: [ "*.htm", "*.html", "*.docx" ]
  #         exclude: [ "*.tmp", "*.part", ".*" ]
  #         change-notify:
  #           enabled: false
  #           debounce: 1s
  #   publish:
  #     enabled: true
  #     interval: 10s
  #     targets:
  #       - name: reputation-delivery
  #         endpoint: delivery-share
  #         remote-path: /outgoing/reputation-lists
  #         export-profile: reputation-lists
