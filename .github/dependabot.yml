version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Irkutsk"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "BUILD"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Irkutsk"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "BUILD"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
