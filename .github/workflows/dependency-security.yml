name: Dependency Security

on:
  schedule:
    # Monday 08:17 in Asia/Irkutsk (GitHub Actions cron is UTC).
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: false

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: "SECURITY CHECKS"
    env:
      DEPENDENCY_CHECK_DATA: ${{ github.workspace }}/.dependency-check-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Restore Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Update Dependency-Check data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "${NVD_API_KEY}" ]]; then
            echo "::error::NVD_API_KEY is not available from the SECURITY CHECKS environment"
            exit 1
          fi

          tools/ci/dependency-security.sh update

      # The scan is deliberately offline: only the preceding explicit step may
      # contact NVD, so update failures and analysis failures remain distinct.
      - name: Scan Maven reactor using cached data
        run: |
          tools/ci/dependency-security.sh scan

      - name: Save Dependency-Check data
        if: always() && steps.dependency-check-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report-${{ github.run_number }}
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
