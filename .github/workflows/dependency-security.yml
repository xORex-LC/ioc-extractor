name: Dependency Security

on:
  schedule:
    # Monday 08:17 in Asia/Irkutsk (GitHub Actions cron is UTC).
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security
  cancel-in-progress: false

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: "SECURITY CHECKS"
      deployment: false
    env:
      DEPENDENCY_CHECK_DATA: ${{ github.workspace }}/.dependency-check-data
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Restore Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Scan Maven reactor
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "${NVD_API_KEY}" ]]; then
            echo "::error::NVD_API_KEY is not available from the SECURITY CHECKS environment"
            exit 1
          fi

          ./mvnw -B -ntp \
            dependency-check:aggregate \
            -DdataDirectory="${DEPENDENCY_CHECK_DATA}" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DassemblyAnalyzerEnabled=false \
            -DossindexAnalyzerEnabled=false \
            -Dformats=HTML,JSON \
            -DfailBuildOnCVSS=7.0

      - name: Save Dependency-Check data
        if: always() && steps.dependency-check-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-${{ github.run_number }}
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
