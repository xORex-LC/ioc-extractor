name: Test Diagnostics

on:
  schedule:
    # Sunday 09:23 in Asia/Irkutsk (GitHub Actions cron is UTC).
    - cron: "23 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-diagnostics
  cancel-in-progress: false

jobs:
  mutation-domain:
    name: Domain mutation pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run bounded domain mutation pilot
        run: tools/ci/test-pilots.sh mutation

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-mutation-pilot-${{ github.run_number }}
          path: |
            core/ioc-domain/target/pit-reports/
            target/test-pilots/mutation-summary.env
          if-no-files-found: warn
          retention-days: 30

  random-order-repeat:
    name: Seeded random-order repeat
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run seeded stability pilot
        run: tools/ci/test-pilots.sh stability --seed 42 --repeat 3

      - name: Upload stability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-pilot-${{ github.run_number }}
          path: target/test-pilots/stability/
          if-no-files-found: warn
          retention-days: 30
