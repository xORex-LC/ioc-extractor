name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:

permissions:
  contents: read

# A new push to the same ref cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Single gate: the reactor build runs ArchUnit + Enforcer + golden e2e.
      # Module boundaries are enforced inside the build, not by extra CI steps.
      - name: Build, test & verify boundaries
        run: tools/ci/build.sh

      # The blocking project-owned gate is deliberately separate from the
      # best-effort external upload below.
      - name: Verify Codecov input
        run: tools/ci/codecov.sh verify-input

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-coverage-reports-${{ github.run_number }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
            build-support/coverage-report/target/site/jacoco-aggregate/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotbugs-reports-${{ github.run_number }}
          # Raw enforcement evidence, filtered module views and both aggregate views.
          path: |
            **/target/spotbugs-raw/spotbugs-raw.xml
            **/target/spotbugs/spotbugs.xml
            **/target/spotbugs/spotbugs.html
            build-support/spotbugs-report/target/spotbugs-raw/spotbugs.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload PMD CPD report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpd-report-${{ github.run_number }}
          path: build-support/cpd-report/target/cpd/
          if-no-files-found: warn
          retention-days: 30

  coverage-reporting:
    name: Codecov advisory
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-coverage-reports-${{ github.run_number }}
          path: .

      - name: Verify downloaded Codecov input
        run: tools/ci/codecov.sh require-report

      - name: Upload aggregate coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: build-support/coverage-report/target/site/jacoco-aggregate/jacoco.xml
          disable_search: true
          disable_telem: true
          plugins: noop
          fail_ci_if_error: false
          handle_no_reports_found: false
          name: reactor-aggregate
          report_type: coverage
          version: v11.3.1

  pmd-source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Analyze production sources with adopted PMD policy
        run: tools/ci/pmd.sh policy

      - name: Upload PMD source-analysis report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmd-source-report-${{ github.run_number }}
          path: build-support/pmd-report/target/pmd/
          if-no-files-found: warn
          retention-days: 30

  packaging-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tools contract exercises release-range inventory against v0.1.0.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check lifecycle scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          tools/ci/packaging.sh

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Offline mode checks local file/anchor existence only (no flaky external URLs).
      - name: Install pinned link checker
        run: tools/dev/bootstrap.sh lychee

      - name: Check documentation links
        run: tools/ci/docs.sh
