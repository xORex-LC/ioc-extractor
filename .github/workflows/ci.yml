name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:

# A new push to the same ref cancels the in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Single gate: the reactor build runs ArchUnit + Enforcer + golden e2e.
      # Module boundaries are enforced inside the build, not by extra CI steps.
      - name: Build, test & verify boundaries
        run: ./mvnw -B -ntp -T 1C verify

  packaging-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lifecycle scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck -x packaging/*.sh packaging/templates/ioc packaging/tests/*.sh
          packaging/tests/packaging-contract-test.sh

  # Documentation links are enforced by the build too: a moved/renamed doc that
  # leaves a dangling relative link fails CI instead of drifting silently.
  # Offline mode checks local file/anchor existence only (no flaky external URLs).
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress docs README.md"
          fail: true
